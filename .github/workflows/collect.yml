name: Günlük veri toplama
on:
  schedule:
    - cron: "0 4 * * *"   # her gün 07:00 (TSİ)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m gundem.collect
      - run: python -m gundem.backfill 2   # trend ölçümü için Google Haberler'i de günlük güncelle
      - name: Veritabanını depoya kaydet
        run: |
          git config user.name "gundem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/gundem.db
          git diff --cached --quiet || git commit -m "Günlük veri güncellemesi"
          git push
